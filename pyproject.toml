[project]
name = "cloudstack-agent"
version = "0.1.0"
description = "A LangGraph agent that manages Apache CloudStack in plain language, over a typed MCP server."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The MCP server alone (read-only tool layer over CloudStack).
mcp = ["mcp>=1.2.0"]
# The agent, on top of the MCP server.
agent = [
  "mcp>=1.2.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-mcp-adapters>=0.1.0",
]
# The web chat UI.
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
